<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" fill="none" role="img" aria-label="Rupesh Poojary — AI Engineer">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#89ddff"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151f"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <style>
      .l { opacity: 0; animation: fadeUp .55s ease forwards; }
      .d1 { animation-delay: .25s; }
      .d2 { animation-delay: .75s; }
      .d3 { animation-delay: 1.35s; }
      .d4 { animation-delay: 1.85s; }
      .d5 { animation-delay: 2.45s; }
      .d6 { animation-delay: 2.95s; }
      @keyframes fadeUp { from { opacity: 0; } to { opacity: 1; } }
      .cur { animation: blink 1.05s steps(1) infinite; animation-delay: 3.4s; }
      @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
      .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace; }
      .prompt { fill: #9ece6a; }
      .cmd { fill: #7aa2f7; }
      .flag { fill: #e0af68; }
      .out { fill: #c0caf5; }
      .dim { fill: #565f89; }
    </style>
  </defs>

  <!-- card -->
  <rect x="2" y="2" width="896" height="326" rx="14" fill="url(#card)" stroke="#232a3b" stroke-width="1.5"/>
  <!-- accent top edge -->
  <rect x="2" y="2" width="896" height="4" rx="2" fill="url(#glow)" opacity="0.9"/>

  <!-- title bar -->
  <circle cx="30" cy="34" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="34" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="34" r="6" fill="#27c93f"/>
  <text x="450" y="39" text-anchor="middle" class="mono dim" font-size="13">rupesh@github  —  ~/profile</text>
  <line x1="2" y1="60" x2="898" y2="60" stroke="#232a3b" stroke-width="1.5"/>

  <!-- body -->
  <g class="mono" font-size="17">
    <text x="34" y="103" class="l d1"><tspan class="prompt">$</tspan> <tspan class="cmd">whoami</tspan></text>
    <text x="34" y="140" class="l d2 out" font-size="30" font-weight="700">Rupesh Poojary</text>

    <text x="34" y="185" class="l d3"><tspan class="prompt">$</tspan> <tspan class="cmd">cat</tspan> <tspan class="flag">role.txt</tspan></text>
    <text x="34" y="214" class="l d4 out">AI Engineer · Agentic Systems · RAG · LLM Evaluation</text>

    <text x="34" y="259" class="l d5"><tspan class="prompt">$</tspan> <tspan class="cmd">echo</tspan> <tspan class="flag">$MISSION</tspan></text>
    <text x="34" y="288" class="l d6 out">Make language models reliable enough to trust in production<tspan class="cur" fill="#7aa2f7" font-weight="700"> ▋</tspan></text>
  </g>
</svg>
